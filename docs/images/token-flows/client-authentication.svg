<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="466" viewBox="0 0 1200 466"><rect width="100%" height="100%" fill="white"/><rect x="20" y="20" width="370" height="168" rx="14" fill="white" stroke="#0972d3" stroke-width="2.5"/><rect x="20" y="20" width="370" height="40" rx="14" fill="#0972d3"/><rect x="20" y="46" width="370" height="14" fill="#0972d3"/><text x="42" y="48" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">client_secret_basic</text><text x="42" y="94" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">an HTTP header:</text><text x="42" y="128" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">Authorization: Basic</text><text x="42" y="162" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">base64(id:secret)</text><rect x="415" y="20" width="370" height="168" rx="14" fill="white" stroke="#0972d3" stroke-width="2.5"/><rect x="415" y="20" width="370" height="40" rx="14" fill="#0972d3"/><rect x="415" y="46" width="370" height="14" fill="#0972d3"/><text x="437" y="48" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">client_secret_post</text><text x="437" y="94" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">client_id</text><text x="437" y="128" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">client_secret</text><text x="437" y="162" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">form fields</text><rect x="810" y="20" width="370" height="304" rx="14" fill="white" stroke="#232f3e" stroke-width="2.5"/><rect x="810" y="20" width="370" height="40" rx="14" fill="#232f3e"/><rect x="810" y="46" width="370" height="14" fill="#232f3e"/><text x="832" y="48" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">private_key_jwt</text><text x="832" y="94" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">client_assertion_type</text><text x="832" y="128" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">  …:jwt-bearer</text><text x="832" y="162" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">client_assertion</text><text x="832" y="196" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">  a JWT you sign:</text><text x="832" y="230" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">  iss, sub</text><text x="968" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">client_id</text><text x="832" y="264" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">  aud</text><text x="907" y="264" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the token URL</text><text x="832" y="298" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">  exp, jti</text><text x="968" y="298" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">short, one use</text><text x="30" y="364" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#232f3e" text-anchor="start">The server checks</text><text x="30" y="398" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  a secret: it matches the one registered for the client</text><text x="30" y="432" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  private_key_jwt: the signature verifies with the client&#x27;s registered public key</text></svg>