<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="100%" height="100%" fill="white"/><rect x="20" y="20" width="530" height="202" rx="14" fill="white" stroke="#0972d3" stroke-width="2.5"/><rect x="20" y="20" width="530" height="40" rx="14" fill="#0972d3"/><rect x="20" y="46" width="530" height="14" fill="#0972d3"/><text x="42" y="48" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">The client sends</text><circle cx="50" cy="87" r="7" fill="#ec7211"/><text x="68" y="94" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">grant_type</text><text x="204" y="94" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">…:jwt-bearer</text><circle cx="50" cy="121" r="7" fill="#ec7211"/><text x="68" y="128" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">assertion</text><text x="192" y="128" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the ID-JAG</text><circle cx="50" cy="155" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="68" y="162" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">scope</text><text x="143" y="162" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">must fit the ID-JAG</text><text x="42" y="196" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">+ client authentication</text><rect x="810" y="20" width="370" height="232" rx="14" fill="white" stroke="#037f0c" stroke-width="2.5"/><rect x="810" y="20" width="370" height="40" rx="14" fill="#037f0c"/><rect x="810" y="46" width="370" height="14" fill="#037f0c"/><text x="832" y="48" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">It gets back</text><text x="832" y="94" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">access_token</text><text x="852" y="124" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">for the target&#x27;s API</text><text x="832" y="158" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">token_type</text><text x="968" y="158" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">Bearer</text><text x="832" y="192" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">expires_in</text><text x="968" y="192" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">seconds</text><text x="832" y="226" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">scope</text><text x="907" y="226" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">what was granted</text><rect x="810" y="270" width="370" height="168" rx="14" fill="white" stroke="#232f3e" stroke-width="2.5"/><rect x="810" y="270" width="370" height="40" rx="14" fill="#232f3e"/><rect x="810" y="296" width="370" height="14" fill="#232f3e"/><text x="832" y="298" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">Inside the token</text><text x="832" y="344" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">iss</text><text x="883" y="344" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the target server</text><text x="832" y="378" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">sub</text><text x="883" y="378" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the user</text><text x="832" y="412" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">aud</text><text x="883" y="412" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the target&#x27;s API</text><rect x="590" y="11.0" width="180" height="220" rx="14" fill="#232f3e"/><text x="680" y="94" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Target</text><text x="680" y="128" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">server</text><text x="680" y="162" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="white" text-anchor="middle">POST /token</text><line x1="554" y1="121.0" x2="576" y2="121.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="586,121.0 572,113.0 572,129.0" fill="#5f6b7a"/><line x1="774" y1="121.0" x2="796" y2="121.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="806,121.0 792,113.0 792,129.0" fill="#5f6b7a"/><text x="30" y="478" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#232f3e" text-anchor="start">The server checks</text><text x="30" y="512" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  the assertion is signed by the IdP, names this server in aud, and is fresh</text><text x="30" y="546" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  the client is the one the ID-JAG names in client_id</text><circle cx="38" cy="589" r="7" fill="#ec7211"/><text x="54" y="596" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">required</text><circle cx="160" cy="589" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="176" y="596" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">optional</text></svg>