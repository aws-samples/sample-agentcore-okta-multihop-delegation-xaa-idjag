<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752"><rect width="100%" height="100%" fill="white"/><rect x="20" y="20" width="530" height="338" rx="14" fill="white" stroke="#0972d3" stroke-width="2.5"/><rect x="20" y="20" width="530" height="40" rx="14" fill="#0972d3"/><rect x="20" y="46" width="530" height="14" fill="#0972d3"/><text x="42" y="48" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">The client sends</text><circle cx="50" cy="87" r="7" fill="#ec7211"/><text x="68" y="94" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">grant_type</text><text x="204" y="94" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">…:token-exchange</text><circle cx="50" cy="121" r="7" fill="#ec7211"/><text x="68" y="128" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">requested_token_type</text><text x="326" y="128" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">…:id-jag</text><circle cx="50" cy="155" r="7" fill="#ec7211"/><text x="68" y="162" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">subject_token</text><text x="241" y="162" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the user&#x27;s token</text><circle cx="50" cy="189" r="7" fill="#ec7211"/><text x="68" y="196" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">subject_token_type</text><text x="302" y="196" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">what it is</text><circle cx="50" cy="223" r="7" fill="#ec7211"/><text x="68" y="230" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">audience</text><text x="180" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the target server&#x27;s issuer URL</text><circle cx="50" cy="257" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="68" y="264" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">scope</text><text x="143" y="264" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">for the target</text><circle cx="50" cy="291" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="68" y="298" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">resource</text><text x="180" y="298" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the target API</text><text x="42" y="332" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">+ client authentication</text><rect x="810" y="20" width="370" height="262" rx="14" fill="white" stroke="#037f0c" stroke-width="2.5"/><rect x="810" y="20" width="370" height="40" rx="14" fill="#037f0c"/><rect x="810" y="46" width="370" height="14" fill="#037f0c"/><text x="832" y="48" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">It gets back</text><text x="832" y="94" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">access_token</text><text x="852" y="124" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">holds the ID-JAG</text><text x="832" y="158" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">issued_token_type</text><text x="1053" y="158" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">…:id-jag</text><text x="832" y="192" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">token_type</text><text x="852" y="222" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">N_A (not a bearer)</text><text x="832" y="256" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">expires_in</text><text x="968" y="256" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">seconds</text><rect x="810" y="300" width="370" height="270" rx="14" fill="white" stroke="#232f3e" stroke-width="2.5"/><rect x="810" y="300" width="370" height="40" rx="14" fill="#232f3e"/><rect x="810" y="326" width="370" height="14" fill="#232f3e"/><text x="832" y="328" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">Inside the ID-JAG</text><text x="832" y="374" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">typ</text><text x="883" y="374" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">oauth-id-jag+jwt</text><text x="832" y="408" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">iss</text><text x="883" y="408" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the IdP</text><text x="832" y="442" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">aud</text><text x="883" y="442" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the target server</text><text x="832" y="476" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">sub</text><text x="883" y="476" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the user</text><text x="832" y="510" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">client_id</text><text x="956" y="510" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">who may redeem it</text><text x="832" y="544" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">scope</text><text x="907" y="544" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">granted</text><rect x="590" y="79.0" width="180" height="220" rx="14" fill="#232f3e"/><text x="680" y="162" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Identity</text><text x="680" y="196" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">provider</text><text x="680" y="230" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="white" text-anchor="middle">POST /token</text><line x1="554" y1="189.0" x2="576" y2="189.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="586,189.0 572,181.0 572,197.0" fill="#5f6b7a"/><line x1="774" y1="189.0" x2="796" y2="189.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="806,189.0 792,181.0 792,197.0" fill="#5f6b7a"/><text x="30" y="610" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#232f3e" text-anchor="start">The server checks</text><text x="30" y="644" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  the subject token is valid, and this client may act for its user</text><text x="30" y="678" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  the client is allowed to reach the target server with these scopes</text><circle cx="38" cy="721" r="7" fill="#ec7211"/><text x="54" y="728" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">required</text><circle cx="160" cy="721" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="176" y="728" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">optional</text></svg>