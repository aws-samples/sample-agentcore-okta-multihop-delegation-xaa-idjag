<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="654" viewBox="0 0 1200 654"><rect width="100%" height="100%" fill="white"/><rect x="20" y="20" width="530" height="402" rx="14" fill="white" stroke="#0972d3" stroke-width="2.5"/><rect x="20" y="20" width="530" height="40" rx="14" fill="#0972d3"/><rect x="20" y="46" width="530" height="14" fill="#0972d3"/><text x="42" y="48" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">The client sends</text><circle cx="50" cy="87" r="7" fill="#ec7211"/><text x="68" y="94" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">grant_type</text><text x="204" y="94" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">…:token-exchange</text><circle cx="50" cy="121" r="7" fill="#ec7211"/><text x="68" y="128" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">subject_token</text><text x="241" y="128" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the token you hold</text><circle cx="50" cy="155" r="7" fill="#ec7211"/><text x="68" y="162" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">subject_token_type</text><text x="302" y="162" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">what it is</text><circle cx="50" cy="189" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="68" y="196" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">audience</text><text x="180" y="196" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">who the new token is for</text><circle cx="50" cy="223" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="68" y="230" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">resource</text><text x="180" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">or name the API by URL</text><circle cx="50" cy="257" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="68" y="264" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">scope</text><text x="143" y="264" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">what to ask for</text><circle cx="50" cy="291" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="68" y="298" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">requested_token_type</text><text x="88" y="328" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">default: access token</text><circle cx="50" cy="355" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="68" y="362" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">actor_token (+_type)</text><text x="326" y="362" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">a separate actor</text><text x="42" y="396" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">+ client authentication</text><rect x="810" y="20" width="370" height="266" rx="14" fill="white" stroke="#037f0c" stroke-width="2.5"/><rect x="810" y="20" width="370" height="40" rx="14" fill="#037f0c"/><rect x="810" y="46" width="370" height="14" fill="#037f0c"/><text x="832" y="48" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">It gets back</text><text x="832" y="94" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">access_token</text><text x="992" y="94" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the new token</text><text x="832" y="128" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">issued_token_type</text><text x="852" y="158" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">…:access_token</text><text x="832" y="192" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">token_type</text><text x="968" y="192" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">Bearer</text><text x="832" y="226" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">expires_in</text><text x="968" y="226" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">seconds</text><text x="832" y="260" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">scope</text><text x="907" y="260" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">what was granted</text><rect x="810" y="304" width="370" height="168" rx="14" fill="white" stroke="#232f3e" stroke-width="2.5"/><rect x="810" y="304" width="370" height="40" rx="14" fill="#232f3e"/><rect x="810" y="330" width="370" height="14" fill="#232f3e"/><text x="832" y="332" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">Inside the new token</text><text x="832" y="378" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">sub</text><text x="883" y="378" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">same as the subject</text><text x="832" y="412" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">aud</text><text x="883" y="412" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the audience asked for</text><text x="832" y="446" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">act</text><text x="883" y="446" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the client that asked</text><rect x="590" y="111.0" width="180" height="220" rx="14" fill="#232f3e"/><text x="680" y="194" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Authorization</text><text x="680" y="228" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">server</text><text x="680" y="262" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="white" text-anchor="middle">POST /token</text><line x1="554" y1="221.0" x2="576" y2="221.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="586,221.0 572,213.0 572,229.0" fill="#5f6b7a"/><line x1="774" y1="221.0" x2="796" y2="221.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="806,221.0 792,213.0 792,229.0" fill="#5f6b7a"/><text x="30" y="512" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#232f3e" text-anchor="start">The server checks</text><text x="30" y="546" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  the subject token is valid, and its issuer is one this server trusts</text><text x="30" y="580" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  the client may exchange tokens, for this audience and these scopes</text><circle cx="38" cy="623" r="7" fill="#ec7211"/><text x="54" y="630" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">required</text><circle cx="160" cy="623" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="176" y="630" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">optional</text></svg>