<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966"><rect width="100%" height="100%" fill="white"/><text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#232f3e" text-anchor="start">Step 1 · the browser goes to the authorization server, and the user signs in</text><rect x="20" y="56" width="530" height="304" rx="14" fill="white" stroke="#0972d3" stroke-width="2.5"/><rect x="20" y="56" width="530" height="40" rx="14" fill="#0972d3"/><rect x="20" y="82" width="530" height="14" fill="#0972d3"/><text x="42" y="84" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">The client sends</text><circle cx="50" cy="123" r="7" fill="#ec7211"/><text x="68" y="130" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">response_type</text><text x="241" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">code</text><circle cx="50" cy="157" r="7" fill="#ec7211"/><text x="68" y="164" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">client_id</text><circle cx="50" cy="191" r="7" fill="#ec7211"/><text x="68" y="198" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">redirect_uri</text><circle cx="50" cy="225" r="7" fill="#ec7211"/><text x="68" y="232" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">scope</text><text x="143" y="232" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">e.g. openid profile</text><circle cx="50" cy="259" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="68" y="266" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">state</text><text x="143" y="266" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">random, checked on return</text><circle cx="50" cy="293" r="7" fill="#ec7211"/><text x="68" y="300" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">code_challenge</text><text x="253" y="300" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">SHA-256 of the verifier</text><circle cx="50" cy="327" r="7" fill="#ec7211"/><text x="68" y="334" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">code_challenge_method</text><text x="338" y="334" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">S256</text><rect x="810" y="56" width="370" height="168" rx="14" fill="white" stroke="#037f0c" stroke-width="2.5"/><rect x="810" y="56" width="370" height="40" rx="14" fill="#037f0c"/><rect x="810" y="82" width="370" height="14" fill="#037f0c"/><text x="832" y="84" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">It gets back</text><text x="832" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">a redirect to redirect_uri with:</text><text x="832" y="164" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">code</text><text x="895" y="164" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">one use, short-lived</text><text x="832" y="198" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">state</text><text x="907" y="198" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the same value</text><rect x="590" y="98.0" width="180" height="220" rx="14" fill="#232f3e"/><text x="680" y="181" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Authorization</text><text x="680" y="215" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">server</text><text x="680" y="249" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="white" text-anchor="middle">GET /authorize</text><line x1="554" y1="208.0" x2="576" y2="208.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="586,208.0 572,200.0 572,216.0" fill="#5f6b7a"/><line x1="774" y1="208.0" x2="796" y2="208.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="806,208.0 792,200.0 792,216.0" fill="#5f6b7a"/><text x="20" y="454" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#232f3e" text-anchor="start">Step 2 · your backend trades the code for tokens</text><rect x="20" y="480" width="530" height="266" rx="14" fill="white" stroke="#0972d3" stroke-width="2.5"/><rect x="20" y="480" width="530" height="40" rx="14" fill="#0972d3"/><rect x="20" y="506" width="530" height="14" fill="#0972d3"/><text x="42" y="508" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">The client sends</text><circle cx="50" cy="547" r="7" fill="#ec7211"/><text x="68" y="554" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">grant_type</text><text x="204" y="554" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">authorization_code</text><circle cx="50" cy="581" r="7" fill="#ec7211"/><text x="68" y="588" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">code</text><text x="131" y="588" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">from step 1</text><circle cx="50" cy="615" r="7" fill="#ec7211"/><text x="68" y="622" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">redirect_uri</text><text x="228" y="622" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the same as step 1</text><circle cx="50" cy="649" r="7" fill="#ec7211"/><text x="68" y="656" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#16191f" text-anchor="start">code_verifier</text><text x="88" y="686" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">the secret behind the challenge</text><text x="42" y="720" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">+ client authentication</text><rect x="810" y="480" width="370" height="270" rx="14" fill="white" stroke="#037f0c" stroke-width="2.5"/><rect x="810" y="480" width="370" height="40" rx="14" fill="#037f0c"/><rect x="810" y="506" width="370" height="14" fill="#037f0c"/><text x="832" y="508" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="start">It gets back</text><text x="832" y="554" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">access_token</text><text x="992" y="554" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">for the user</text><text x="832" y="588" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">id_token</text><text x="944" y="588" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">if scope has openid</text><text x="832" y="622" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">refresh_token</text><text x="1005" y="622" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">if allowed</text><text x="832" y="656" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">token_type</text><text x="968" y="656" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">Bearer</text><text x="832" y="690" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">expires_in</text><text x="968" y="690" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">seconds</text><text x="832" y="724" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">scope</text><text x="907" y="724" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">what was granted</text><rect x="590" y="503.0" width="180" height="220" rx="14" fill="#232f3e"/><text x="680" y="586" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Authorization</text><text x="680" y="620" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">server</text><text x="680" y="654" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="white" text-anchor="middle">POST /token</text><line x1="554" y1="613.0" x2="576" y2="613.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="586,613.0 572,605.0 572,621.0" fill="#5f6b7a"/><line x1="774" y1="613.0" x2="796" y2="613.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="806,613.0 792,605.0 792,621.0" fill="#5f6b7a"/><text x="30" y="790" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#232f3e" text-anchor="start">The server checks</text><text x="30" y="824" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  the user signed in, and may use this app</text><text x="30" y="858" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  SHA-256(code_verifier) matches the code_challenge from step 1</text><text x="30" y="892" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#16191f" text-anchor="start">✓  the code is unused and fresh, and redirect_uri matches</text><circle cx="38" cy="935" r="7" fill="#ec7211"/><text x="54" y="942" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">required</text><circle cx="160" cy="935" r="6" fill="white" stroke="#5f6b7a" stroke-width="2"/><text x="176" y="942" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5f6b7a" text-anchor="start">optional</text></svg>